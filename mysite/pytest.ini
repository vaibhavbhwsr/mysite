[pytest]

# cmd: 'pytest' to run all tests

# connecting settings file
DJANGO_SETTINGS_MODULE = mysite.settings

# optional but recommended
python_files = tests.py test_*.py *_test.py

# can be appended while running pytest command in terminal.
# # append pytest command befor adding coverage command
# addopts=-v --nomigrations --ignore=venv

# append pytest command after adding coverage command
addopts=-v --nomigrations --ignore=venv --cov=. --cov-report=html --cov-config=.coveragerc