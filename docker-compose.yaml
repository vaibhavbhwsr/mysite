services:

  # Django webapp
  fireshine:
    container_name: fireshine_dev_container
    image: fireshine_dev_image
    build:
      context: ./mysite
      dockerfile: Dockerfile.dev
    volumes:
      - ./mysite:/webapp
    ports:
      - 8000:8000
    env_file:
      - .env
    command: python manage.py runserver 0:8000
    network_mode: host  # Connect with host postgres and redis

