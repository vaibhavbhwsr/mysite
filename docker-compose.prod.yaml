services:

  # Django WSGI and ASGI App
  django_app:
    container_name: fireshine_prod_container
    image: vaibhavbhwsr/fireshine_prod_image
    build:
      context: ./mysite
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
      - "8001:8001"
    env_file:
      - .env.prod
    entrypoint: /webapp/entrypoint.sh
    depends_on:
      - db
      - redis
    volumes:
      - static_files:/webapp/mysite/staticfiles
      - media_files:/webapp/mysite/media
    network_mode: host

    # volumes:  # not mounting live directory
    #   - ./mysite:/webapp
    # networks:
    #   - fireshine_network

  # Nginx
  nginx:
    container_name: nginx_container
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-setup.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/webapp/mysite/staticfiles
      - media_files:/webapp/mysite/media
      # - ./mysite:/webapp  # not mounting the whole directory
    depends_on:
      - django_app
    # networks:
    #   - fireshine_network


