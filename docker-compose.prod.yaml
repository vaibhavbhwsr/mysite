services:

  # Django WSGI and ASGI App
  django_app:
    container_name: fireshine_prod_container
    image: vaibhavbhwsr/fireshine_prod_image
    build:
      context: ./mysite
      dockerfile: Dockerfile.prod
    volumes:
      - ./mysite:/webapp
    ports:
      - "8000:8000"
      - "8001:8001"
    env_file:
      - .env.prod
    entrypoint: /webapp/entrypoint.sh
    depends_on:
      - db
      - redis

  # Database postgres
  db:
    container_name: postgres_container
    image: postgres
    volumes:
      - mysitedb:/var/lib/postgres/data
    environment:
      - POSTGRES_DB=mysitedb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=psql

  # Redis
  redis:
    container_name: redis_container
    image: redis:alpine

  # Nginx
  nginx:
    container_name: nginx_container
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx-setup.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mysite:/webapp
    depends_on:
      - django_app

volumes:
  mysitedb:
